# The generator's OWN bench.
#
# It exists so the golden gate never touches someone else's containers. A DDL
# lane drops and recreates tables, and the engines a developer keeps running are
# the ones their service and their QA suite are using right now — borrowing them
# means a gate that passes here by breaking work over there.
#
# Everything is namespaced: the project is `omnicore-gen`, every container is
# `omnicore-gen-*`, and every published port is its own. Nothing here collides
# with a dev bench (5432/3306/1433/1521/27017) or with the QA bench
# (5433/3317/14333/15211/27028).
#
#   docker compose -f plugins/omnicore/gen/devops/docker-compose.yml up -d
#   docker compose -f plugins/omnicore/gen/devops/docker-compose.yml down -v
#
# The gate SKIPS, loudly, whatever is not up — so none of this is required to
# run it. Bring up only the engines you want covered.
name: omnicore-gen

services:
  postgres:
    image: postgres:16
    container_name: omnicore-gen-postgres
    environment:
      POSTGRES_USER: omnicore
      POSTGRES_PASSWORD: omnicore
      POSTGRES_DB: gen_ddl
    ports: ['15432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnicore']
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8
    container_name: omnicore-gen-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gen_ddl
    ports: ['13306:3306']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -proot']
      interval: 5s
      timeout: 5s
      retries: 20

  # Behind a profile: the image is large and slow to start, and most runs do not
  # need it. `--profile heavy` opts in.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: omnicore-gen-sqlserver
    profiles: ['heavy']
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'OmnicoreGen!2026'
    ports: ['11433:1433']

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: omnicore-gen-oracle
    profiles: ['heavy']
    environment:
      ORACLE_PASSWORD: omnicore
      APP_USER: omnicore
      APP_USER_PASSWORD: omnicore
    ports: ['11521:1521']
