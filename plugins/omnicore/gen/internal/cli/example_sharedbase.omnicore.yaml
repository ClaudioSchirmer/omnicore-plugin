# A COMPLETE, VALID spec — the SHARED-IDENTITY posture.
#
# `omnicore-gen check` accepts this file as it stands, and a test in this build
# asserts that, so it cannot drift into an example that no longer works.
#
# It exists because the flat example cannot show everything: storage.kind is one
# value, so a single spec can never carry both postures. Together they cover the
# language. What lives HERE and nowhere else:
#
#   the whole storage.base block   — link, naturalKey, schemaFunc, linkColumn,
#                                    rowUniqueness, orphanPolicy, reuse
#   fields[].livesOn: base|role    — which table a field is stored in
#   children[].editStrategy: per-child + duplicateNotification
#   children[].ownedBy: base       — a collection of the IDENTITY, not of the role
#   siblings[].attachTo: role      — a 1:1 facet of the role
#   rules: requiredIf · skipWhen · transition · comparison · groupCap ·
#          childDuplicate · ownerCheck with adminField
#   read.indexes · search · ttlSeconds · fieldRestrict
#
# Copy the STRUCTURE, never the domain.
specVersion: 1
entity: Professor
plural: Professores
language: pt-BR

storage:
  # A ROLE over an identity other roles may share: the same person can be a
  # teacher today and a supplier later, without duplicating the person.
  kind: sharedbase-role
  table: professores
  description: Professores — o papel docente sobre a identidade de pessoa.
  base:
    table: pessoas
    # REQUIRED: the exported Go function that returns the identity's schema.
    schemaFunc: PessoaBase
    # REQUIRED for separate-fk, REFUSED for shared-pk (there the role's own
    # primary key IS the identity's, so there is no second column to name).
    linkColumn: pessoa_id
    description: Identidade de pessoa, compartilhada entre papéis.
    # false = this spec writes the base. true = another role already declares it,
    # and this one only points at it.
    reuse: false
    # The value the identity is deduplicated by; the framework derives the
    # identity's key from it, so two roles created with the same one resolve to
    # ONE person rather than to two.
    naturalKey: Documento
    link: separate-fk
    # active-only: an archived role frees the slot, so the person can hold the
    # role again later while the old rows stay as history.
    rowUniqueness: active-only
    orphanPolicy: delete-when-unreferenced
  managed:
    revision: revision
    createdAt: created_at
    updatedAt: updated_at
    archivedAt: deleted_at

fields:
  # livesOn decides the TABLE: base fields are shared by every role over the
  # identity; role fields are private to this one.
  - name: Documento
    type: string
    column: documento
    length: 20
    livesOn: base
    example: "123.456.789-00"
    description: Documento da pessoa — chave natural da identidade.
  - name: Nome
    type: string
    column: nome
    length: 160
    livesOn: base
    example: Helena Duarte
    description: Nome da pessoa.
  - name: Email
    type: string
    column: email
    length: 160
    livesOn: base
    vo: {kind: raw, ref: EmailPessoa}
    example: helena@escola.br
    description: E-mail da pessoa.
  - name: Matricula
    type: string
    column: matricula
    length: 20
    livesOn: role
    unique:
      enforce: service-precheck+constraint
      notification: MatriculaJaExisteNotification
      # active-only: an archived teacher frees the number for reuse.
      scope: active-only
    example: DOC-2026-001
    description: Matrícula funcional do professor.
  - name: Situacao
    type: string
    column: situacao
    length: 20
    livesOn: role
    vo: {kind: enum, ref: SituacaoProfessor}
    example: ativo
    description: Situação do vínculo.
  - name: CargaHoraria
    type: int
    column: carga_horaria
    livesOn: role
    example: "40"
    description: Carga horária semanal.
  - name: AdmitidoEm
    type: time
    column: admitido_em
    livesOn: role
    example: "2026-02-01T09:00:00Z"
    description: Data de admissão.
  - name: DesligadoEm
    type: time
    column: desligado_em
    nullable: true
    livesOn: role
    example: "2026-12-20T18:00:00Z"
    description: Data de desligamento, quando houver.
  # Runtime-only: read from a token claim, never persisted. `bool` is read from a
  # boolean claim or from the string "true".
  - name: SolicitanteEmail
    type: string
    runtime: true
    claim: email
    livesOn: root
    example: helena@escola.br
    description: E-mail de quem chamou.
  - name: SolicitanteAdmin
    type: bool
    runtime: true
    claim: is_admin
    livesOn: root
    example: "false"
    description: Se quem chamou é administrador.

valueObjects:
  - name: EmailPessoa
    kind: raw
    backing: string
    description: E-mail válido.
    regex: '^[^@\s]+@[^@\s]+\.[a-z]{2,}$'
    minLength: 6
    maxLength: 160
    notification: EmailPessoaInvalidoNotification
  - name: SituacaoProfessor
    kind: enum
    backing: string
    description: Situação do vínculo docente.
    unknownNotification: SituacaoProfessorInvalidaNotification
    members:
      - {name: Ativo, value: ativo}
      - {name: Afastado, value: afastado}
      - {name: Desligado, value: desligado}

children:
  # ownedBy: base — the collection belongs to the IDENTITY. It survives this role
  # being archived and every other role over the same person reads the same rows.
  - name: Endereco
    plural: Enderecos
    table: pessoa_enderecos
    parentColumn: pessoa_id
    description: Endereços da pessoa, compartilhados entre papéis.
    ownedBy: base
    editStrategy: atomic-replace
    businessIdentity: [Cep, Numero]
    fields:
      - {name: Logradouro, type: string, column: logradouro, length: 160, example: Rua das Acácias, description: Logradouro.}
      - {name: Numero, type: string, column: numero, length: 10, example: "128", description: Número.}
      - {name: Cep, type: string, column: cep, length: 9, example: 90000-000, description: CEP.}

  # editStrategy: per-child — POST/PUT on /:id/turmas[/:turmaId], a duplicate
  # answer on add, and a 404 for an entry that is not there. softRemove makes the
  # removal reversible, so it is mounted as PATCH .../archive rather than DELETE.
  - name: Turma
    plural: Turmas
    table: professor_turmas
    parentColumn: professor_id
    description: Turmas que o professor conduz.
    ownedBy: role
    editStrategy: per-child
    duplicateNotification: TurmaJaAtribuidaNotification
    businessIdentity: [Codigo]
    softRemove: true
    archivedAt: deleted_at
    fields:
      - {name: Codigo, type: string, column: codigo, length: 20, example: 3B-2026, description: Código da turma.}
      - {name: Disciplina, type: string, column: disciplina, length: 80, example: Matemática, description: Disciplina.}
      - {name: Periodo, type: string, column: periodo, length: 10, example: manha, description: Período.}
    rules:
      list:
        - {id: codigo-turma-obrigatorio, kind: required, scope: [insertOrUpdate], fields: [Codigo], notification: RequiredFieldNotification}
        # A notification raised by a CHILD's rule is declared in aggregatevos:
        # domain imports aggregatevos, so holding it in domain is an import
        # cycle. The generator places it there and the report says so.
        - id: disciplina-tem-tamanho
          kind: length
          scope: [insertOrUpdate]
          fields: [Disciplina]
          min: 3
          notification: DisciplinaInvalidaNotification

siblings:
  # attachTo: role — a 1:1 facet of the ROLE (a shared base cannot have one: it
  # has many roles, so the 1:1 does not hold). Its fields are fields of the same
  # Go type, split into another table so they can be null in bulk.
  - name: Titulacao
    table: professor_titulacoes
    description: Titulação acadêmica, quando informada.
    attachTo: role
    fields:
      - {name: TituloMaximo, type: string, column: titulo_maximo, length: 40, nullable: true, example: Doutorado, description: Maior titulação.}
      - {name: InstituicaoTitulo, type: string, column: instituicao_titulo, length: 160, nullable: true, example: UFRGS, description: Instituição.}

modes: [display, insert, update, archive, unarchive]

update:
  shape: both
  # A field a partial update may NOT touch — a natural key, or anything whose
  # change has to go through a deliberate operation instead.
  patchExcludes: [Documento]

delete:
  root: soft

rules:
  list:
    - {id: nome-obrigatorio, kind: required, scope: [insertOrUpdate], fields: [Nome], notification: RequiredFieldNotification}
    # immutable reads the pre-write snapshot, so it only applies on update.
    - id: documento-imutavel
      kind: immutable
      scope: [update]
      fields: [Documento]
      notification: DocumentoImutavelNotification
    - id: carga-valida
      kind: range
      scope: [insertOrUpdate]
      fields: [CargaHoraria]
      min: 1
      max: 44
      notification: CargaHorariaInvalidaNotification
      echoValue: true
    # comparison relates two fields; skipWhen stands down when the subject is
    # absent — "valid IF given" rather than "required".
    - id: desligamento-depois-da-admissao
      kind: comparison
      scope: [insertOrUpdate]
      fields: [DesligadoEm]
      other: AdmitidoEm
      operator: gte
      skipWhen: "null"
      notification: DesligamentoAntesDaAdmissaoNotification
    # requiredIf: this field becomes required when THAT one carries a value.
    - id: desligado-exige-situacao
      kind: requiredIf
      scope: [insertOrUpdate]
      fields: [Situacao]
      other: DesligadoEm
      notification: RequiredFieldNotification
    # transition: the state machine. Update only — an insert has nothing to move
    # from — and a value that did not change is always allowed.
    - id: transicao-de-situacao
      kind: transition
      scope: [update]
      fields: [Situacao]
      transitions:
        ativo: [afastado, desligado]
        afastado: [ativo, desligado]
      notification: TransicaoInvalidaNotification
    # childDuplicate and groupCap read the whole COLLECTION, so they name it
    # instead of naming fields.
    - id: sem-turma-repetida
      kind: childDuplicate
      scope: [insertOrUpdate]
      fields: [Turma]
      notification: TurmaJaAtribuidaNotification
    - id: no-maximo-duas-por-periodo
      kind: groupCap
      scope: [insertOrUpdate]
      fields: [Turma]
      groupBy: [Periodo]
      cap: 2
      notification: DemasiadasTurmasNotification
    # ownerCheck is Layer 2: the permission says who may attempt the verb at all,
    # this says who may attempt it on a row that is not theirs. adminField is the
    # bypass, and it is a separate question from the permission.
    - id: so-o-dono-arquiva
      kind: ownerCheck
      scope: [archive]
      fields: [Email]
      ownerField: SolicitanteEmail
      adminField: SolicitanteAdmin
      notification: ArchiveNotAllowedNotification
  # Anything the DSL cannot express goes here as a NAMED item: it becomes a line
  # in the report and a stub in a file regeneration never touches.
  manual:
    - id: carga-somada-das-turmas
      description: >-
        A soma da carga horária das turmas ativas do professor não pode exceder
        a carga horária contratada.
      scope: [insertOrUpdate]
      notification: CargaHorariaInvalidaNotification

notifications:
  - name: MatriculaJaExisteNotification
    semantic: conflict
    description: Matrícula já usada por outro professor ativo.
    text: {ptbr: "Já existe um professor com essa matrícula.", eng: "A teacher with this registration number already exists.", esp: "Ya existe un profesor con esa matrícula.", fra: "Un enseignant avec ce matricule existe déjà.", deu: "Es gibt bereits eine Lehrkraft mit dieser Nummer.", ita: "Esiste già un docente con questa matricola.", nld: "Er bestaat al een docent met dit nummer."}
  - name: DocumentoImutavelNotification
    semantic: validation
    description: Tentativa de trocar a chave natural da identidade.
    text: {ptbr: "O documento não pode ser alterado.", eng: "The document cannot be changed.", esp: "El documento no puede cambiarse.", fra: "Le document ne peut pas être modifié.", deu: "Das Dokument kann nicht geändert werden.", ita: "Il documento non può essere modificato.", nld: "Het document kan niet worden gewijzigd."}
  - name: CargaHorariaInvalidaNotification
    semantic: validation
    description: Carga horária fora do intervalo contratual.
    tvars: [min, max]
    text: {ptbr: "A carga horária deve estar entre {min} e {max}.", eng: "The workload must be between {min} and {max}.", esp: "La carga debe estar entre {min} y {max}.", fra: "La charge doit être entre {min} et {max}.", deu: "Die Stundenzahl muss zwischen {min} und {max} liegen.", ita: "Il carico deve essere tra {min} e {max}.", nld: "De belasting moet tussen {min} en {max} liggen."}
  - name: DesligamentoAntesDaAdmissaoNotification
    semantic: validation
    description: Desligamento anterior à admissão.
    text: {ptbr: "O desligamento não pode ser anterior à admissão.", eng: "The termination cannot precede the admission.", esp: "La baja no puede ser anterior al alta.", fra: "Le départ ne peut pas précéder l'arrivée.", deu: "Der Austritt kann nicht vor dem Eintritt liegen.", ita: "La cessazione non può precedere l'assunzione.", nld: "Het vertrek kan niet vóór de indiensttreding liggen."}
  - name: TransicaoInvalidaNotification
    semantic: state-conflict
    description: Mudança de situação não permitida.
    text: {ptbr: "O professor não pode ir para essa situação.", eng: "The teacher cannot move to that state.", esp: "El profesor no puede pasar a ese estado.", fra: "L'enseignant ne peut pas passer à cet état.", deu: "Die Lehrkraft kann nicht in diesen Zustand wechseln.", ita: "Il docente non può passare a questo stato.", nld: "De docent kan niet naar die staat."}
  - name: TurmaJaAtribuidaNotification
    semantic: conflict
    description: Turma já atribuída a este professor.
    text: {ptbr: "Essa turma já está atribuída ao professor.", eng: "That class is already assigned to the teacher.", esp: "Esa clase ya está asignada.", fra: "Cette classe est déjà attribuée.", deu: "Diese Klasse ist bereits zugewiesen.", ita: "Quella classe è già assegnata.", nld: "Die klas is al toegewezen."}
  - name: DemasiadasTurmasNotification
    semantic: validation
    description: Excesso de turmas no mesmo período.
    text: {ptbr: "Há turmas demais no mesmo período.", eng: "Too many classes in the same period.", esp: "Demasiadas clases en el mismo periodo.", fra: "Trop de classes sur la même période.", deu: "Zu viele Klassen im selben Zeitraum.", ita: "Troppe classi nello stesso periodo.", nld: "Te veel klassen in dezelfde periode."}
  # package: aggregatevos — raised by a child's rule, so the type must live
  # beside the child. Declaring it in domain would be an import cycle.
  - name: DisciplinaInvalidaNotification
    package: aggregatevos
    semantic: validation
    description: Nome de disciplina curto demais.
    text: {ptbr: "O nome da disciplina é curto demais.", eng: "The subject name is too short.", esp: "El nombre de la asignatura es demasiado corto.", fra: "Le nom de la matière est trop court.", deu: "Der Fachname ist zu kurz.", ita: "Il nome della materia è troppo corto.", nld: "De vaknaam is te kort."}
  # package: vos — raised by a value object.
  - name: EmailPessoaInvalidoNotification
    package: vos
    semantic: validation
    description: E-mail fora do formato.
    text: {ptbr: "O e-mail informado não é válido.", eng: "The e-mail is not valid.", esp: "El correo no es válido.", fra: "L'e-mail n'est pas valide.", deu: "Die E-Mail ist ungültig.", ita: "L'e-mail non è valida.", nld: "Het e-mailadres is ongeldig."}
  - name: SituacaoProfessorInvalidaNotification
    package: vos
    semantic: validation
    description: Situação fora do conjunto.
    text: {ptbr: "Situação inválida.", eng: "Invalid state.", esp: "Estado inválido.", fra: "État invalide.", deu: "Ungültiger Zustand.", ita: "Stato non valido.", nld: "Ongeldige staat."}

service:
  required: true
  facts:
    - name: TurmasAtivasDaMatricula
      kind: count
      description: Quantas turmas ativas a matrícula já tem.
      # The fact narrows by a field, may exclude the record being written
      # (so an update does not collide with itself) and may count only the
      # rows that are not archived.
      field: Matricula
      filters: [Situacao]
      excludeSelf: true
      activeOnly: true

read:
  backing: mongo
  view:
    name: professores
    version: 1
    maxLimit: 100
    # A projection rebuilt from scratch drops archived documents when this is on.
    deleteOnArchive: false
    # A time-to-live on the projected document, in SECONDS.
    ttlSeconds: 0
  indexes:
    - {fields: [Matricula], unique: true}
    - {fields: [Nome], text: true}
    # sparse indexes only the documents that HAVE the field.
    - {fields: [Situacao, AdmitidoEm], order: desc, sparse: true}
  # A field a caller without the permission does not receive — and naming it
  # explicitly is a 403 rather than a silent omission.
  fieldRestrict:
    - {field: Email, permission: "professor:ver-contato"}
  byId: true
  byParams:
    filters:
      - {field: Nome, ops: [eq, contains, icontains]}
      - {field: Matricula, ops: [eq]}
      - {field: Situacao, ops: [eq, in]}
    controls:
      pagination: true
      orderBy: true
      fields: true
      includeArchived: true
      onlyTotal: true
      search: [Nome]

surfaces:
  rest: true
  graphql: {enabled: true, connection: true, mutations: [insert, update, archive, unarchive]}
  exports: {csv: {delimiter: ";"}, xlsx: {sheet: Professores}}

authz:
  resource: professor
  dataAccess: anyone-with-permission
  permissions:
    insert: "professor:escrever"
    update: "professor:escrever"
    patch: "professor:escrever"
    archive: "professor:arquivar"
    unarchive: "professor:arquivar"
    read: "professor:ler"
