children:
  - name: Guardian
    plural: Guardians
    table: student_guardians
    parentColumn: student_id
    description: The student's guardians.
    ownedBy: root
    editStrategy: atomic-replace
    businessIdentity: [Document]
    softRemove: true
    archivedAt: deleted_at
    fields:
      - name: FullName
        type: string
        column: full_name
        length: 120
        example: Martin Reid
        description: The guardian's full name.
        labelKey: GuardianFullNameField
      - name: Document
        type: string
        column: document
        length: 20
        example: "PA-4471902"
        description: The guardian's identification document.
        labelKey: GuardianDocumentField
      - name: Phone
        type: string
        column: phone
        length: 20
        nullable: true
        example: "+1 555 0134 8890"
        description: A contact phone number.
        labelKey: GuardianPhoneField
      - name: CityID
        type: id
        column: city_id
        nullable: true
        example: 8c1d0f77-5b41-4a35-8f11-6d6e4c9b0a3e
        description: The city the guardian lives in, when it is on record.
        labelKey: GuardianCityIDField
    # A COMPUTED read field on the ENTRY — the per-entry twin of read.computed
    # below, and the seat that key cannot be.
    #
    # A root derivation runs once per DOCUMENT and is handed values; what the
    # root holds for a collection is a slice, so it has no single entry to be
    # handed. Declared here the derivation runs once per ENTRY, taking that
    # entry's own fields — which is the shape of every "one label per row".
    #
    # `from:` names the ENTRY's fields, bare: the entry is the scope, so
    # `Guardians` is not spelled in front of them. The framework records a nested
    # field's sources under the same segment prefix as the field itself, so
    # ?fields=guardians.contactLabel pushes guardians.FullName + guardians.Phone
    # down without either side spelling the segment out.
    #
    # Read only, and one step more so than the root's: the per-entry write verbs
    # return the entry through its own <Entry>Response, which carries what was
    # STORED.
    computed:
      - name: ContactLabel
        type: string
        from: [FullName, Phone]
        labelKey: GuardianContactLabelField
        example: "Martin Reid — +1 555 0134 8890"
        description: The guardian's name and phone on one line, for listings.
    rules:
      list:
        - id: guardian-name-required
          kind: required
          scope: [insertOrUpdate]
          fields: [FullName]
          notification: RequiredFieldNotification
        - id: guardian-document-required
          kind: required
          scope: [insertOrUpdate]
          fields: [Document]
          notification: RequiredFieldNotification

siblings:
  - name: Scholarship
    table: student_scholarships
    description: The student's scholarship details, when there is one.
    attachTo: root
    fields:
      - name: ScholarshipSponsor
        type: string
        column: sponsor
        length: 120
        nullable: true
        example: Alpha Foundation
        description: Who sponsors the scholarship.
        labelKey: StudentScholarshipSponsorField
      - name: ScholarshipPercentage
        type: float64
        column: percentage
        nullable: true
        example: "50"
        description: The scholarship's discount percentage.
        labelKey: StudentScholarshipPercentageField

# READ JOINS — reaching ANOTHER aggregate from this one's queries.
#
# Declared here, they land on the REPOSITORY, never on the TableSchema and never
# on a view. That placement is the whole design:
#
#   * not storage — the TableSchema is untouched, so no INSERT or UPDATE can
#     ever carry a joined column, and a Mongo projection of this entity is
#     unaffected;
#   * not the read model either — it hangs off the LOADER, so ONE declaration
#     reaches FindByID (which the write-side handlers load through), a service
#     calling the loader directly, and the relational read model declared over
#     the same loader, which inherits the reach and declares nothing itself.
#
# The consequence worth knowing BEFORE writing a rule: a rule that needs a value
# belonging to another aggregate no longer has to copy that column into this
# table. Declare the traversal and the field is an ordinary field of the entity,
# filled on every load.
#
# It is 1:1 and horizontal — one column onto one field at a time. There is no
# many-valued form: a 1:N traversal would multiply the root's rows and break the
# paged read, so "bring the order's items" is a child collection, never a join.
joins:
  # A ROOT join. It is ALWAYS in the FROM and its columns ride the root SELECT,
  # so the values cost no second round trip and the field is populated on EVERY
  # read — one that appeared only when a filter happened to mention it would be
  # blank on the next call.
  #
  # kind: inner is legal ONLY over a non-nullable foreign key. The declaration
  # reaches FindByID too, so over a nullable one it would silently drop
  # aggregates and turn a legitimate write into a 404 — the framework refuses
  # that combination and names left as the fix.
  - to: Campus
    kind: inner
    on: campus_id
    fields:
      # The Go field is YOURS: the joined side's spelling never surfaces above
      # infrastructure, so renaming is free. `type` is stated here only because
      # Campus is hand-written — when the target is another spec of this
      # project the type is DERIVED from its own declaration, which is the one
      # place the two cannot disagree.
      - name: CampusName
        type: string
        column: name
        example: North Campus
        description: The campus's name, as the campus itself declares it.
        labelKey: StudentCampusNameField
        text: {eng: Campus, ptbr: Campus}
      # hidden: ON THE ENTITY, OFF THE WIRE. The value is filled on every load
      # and the rules and the domain service read it like any other field — it
      # is simply in no response body and in no export. That is the shape for a
      # traversal declared FOR A RULE: needing the value and publishing it are
      # different questions, so the language asks them separately.
      # nullable: the column can be NULL ON THE TARGET, so the field lands in a
      # pointer even though this is an INNER join — the join proves the campus
      # ROW exists, never that every column of it is filled. Like `type`, it is
      # stated only because Campus is hand-written: when the target is another
      # spec of this project both are read off its own declaration, and
      # restating either one here is refused.
      - name: CampusBudgetCode
        type: string
        nullable: true
        column: budget_code
        hidden: true
        description: The campus's budget code — read by the rules, never served.
        labelKey: StudentCampusBudgetCodeField
      # The framework-STAMPED columns of the target are reachable too, and no
      # fields[] entry anywhere declares them: the createdAt, updatedAt and
      # archivedAt slots of the target's storage.managed are declared BY
      # PRESENCE, and its TableSchema resolves whatever column sits in each one
      # under a fixed logical name — which is exactly what the join's column
      # check consults. `column:` is still the TARGET's own spelling: deleted_at
      # here because that is what this Campus calls it, not because the
      # framework fixes the name. When the target is a spec of this project both
      # the type and the nullability come off that declaration; here Campus is
      # hand-written, so this side states them.
      #
      # The archive column is a POINTER even under an INNER join: "never
      # archived" is the NORMAL state of a row, so it is NULL on the first row
      # read. It is also the one nullability the framework cannot check for you —
      # the fields of domain.Managed are unexported, so its reflective check has
      # nothing to point at and answers "not nullable" rather than guessing.
      #
      # The REVISION is the one managed column that does not cross: it guards the
      # target's own writes, so a copy of it here is stale the moment that
      # aggregate is written again, and the traversal onto it is refused.
      - name: CampusArchivedAt
        type: time
        nullable: true
        column: deleted_at
        example: "2026-02-01T09:00:00Z"
        description: When the campus was archived, if it was.
        labelKey: StudentCampusArchivedAtField
        text: {eng: Campus archived at, ptbr: Campus arquivado em}

  # A join FROM ONE OF THIS ENTITY'S OWN COLLECTIONS. The verb names the
  # collection, `on` names the foreign key on ITS table, and the mapped field
  # lands on the entry.
  #
  # A child join is LOAD-ONLY: its fields are filled on every loaded entry and
  # served inside it (?fields= names them guardians.CityName), but they are
  # neither filterable nor sortable — narrowing the root by a field of a 1:N
  # collection is a pushdown one root SELECT cannot express, which is the same
  # boundary every child field already has.
  - to: City
    kind: left
    on: city_id
    inChild: Guardian
    fields:
      # A LEFT join's field is nullable by construction: with no counterpart the
      # column reads NULL, and nil there means "there is no counterpart" — not
      # the zero value, which is a different answer.
      - name: CityName
        type: string
        column: name
        example: Porto Alegre
        description: The guardian's city, when one is on record.
        labelKey: GuardianCityNameField

service:
  required: true
  facts:
    # The generator cannot answer this one: the truth lives in another service.
    # Marking it manual makes it declare the method and refuse to invent a body.
    - name: CourseIsOpen
      kind: manual
      returns: bool
      filters: [EnrollmentNumber]
      description: >-
        Whether the course this enrolment points at is still open, according to
        the Catalog service. It is NOT answerable from this service's tables —
        the catalogue is owned elsewhere.

    - name: EnrollmentNumberTaken
      kind: exists
      filters: [EnrollmentNumber]
      excludeSelf: true
      activeOnly: true
      description: >-
        Reports whether another ACTIVE student already holds this enrollment
        number. Excludes the row being updated, so an update never collides
        with itself.

    # `filters` is the fact's WHERE, and it is the framework's own criteria tree
    # rather than a list of equalities. A bare name is an `eq` whose value the
    # caller passes — which is what every filter above is, and what a filter
    # meant before the block form existed. The block form names the operator.
    #
    # `values` PINS the comparison here instead of taking it as a parameter, and
    # that is the point of this fact: the bucket "on the way out" is defined in
    # the spec, once, beside the question it belongs to. Declared at the call
    # site instead, it is repeated by every caller and a sixth status means
    # editing each of them — and a fact with no parameter of its own is one a
    # rules.list factRange entry can still read, because a declarative rule
    # fills a fact's arguments from the entity and has nothing to fill a
    # constant with.
    - name: EndingOnCampus
      kind: count
      description: >-
        How many enrolments on this campus are on their way out. Over an enum
        the pinned literal is the MEMBER'S NAME, checked against the members
        declared above; the generator writes its stored value into the query.
      filters:
        - CampusID
        - {field: Status, op: in, values: [Withdrawing, Dropped]}
        # isnull/notnull ask about the COLUMN being empty, so they take neither
        # a parameter nor a pinned value — and they are refused on a field that
        # is not nullable, where the answer would be the same for every row.
        - {field: GraduatedAt, op: isnull}
      activeOnly: true

    # The connectives. `any` is an OR, `all` is an AND nested inside one (the
    # top-level list is already an AND, so `all` is only ever useful in here),
    # and `not` negates what is under it — several nodes ANDed first, which is
    # why "neither of these" is written as a not around an any.
    #
    # `as` names the parameter a leaf contributes. The default is the field's
    # own name, and it stops working the moment one field is compared twice: two
    # parameters of one name do not compile, so the spec is refused and the
    # author picks the words instead of the generator inventing a suffix.
    - name: LookalikesOnCampus
      kind: count
      description: >-
        How many OTHER enrolments on this campus could be mistaken for this one
        — the same name, or an enrollment number in the same series from someone
        at least as far along — never counting one that has already graduated,
        however that ending was recorded.
      filters:
        - CampusID
        - any:
            - {field: Name, op: eq, as: exactName}
            - all:
                - {field: EnrollmentNumber, op: startswith, as: numberSeries}
                - {field: Grade, op: gte, as: minGrade}
        - not:
            - any:
                - {field: Status, op: eq, value: Graduated}
                - {field: GraduatedAt, op: notnull}
      excludeSelf: true
      activeOnly: true

    # `aggregates` asks SEVERAL numbers of the same rows in ONE query, which is
    # what the framework's aggregate loader takes. Asked as one fact each, these
    # three would be three queries over identical criteria — and two answers a
    # rule compares would never have been guaranteed to be about the same
    # instant. The answer becomes a STRUCT: one field per entry, named by `as`,
    # plus the grouping keys. `as` is required rather than derived because a min
    # and a max of ONE column have no distinct name to derive from the field.
    #
    # A rule bounds ONE of them, and says which: fact: CampusStandingByStatus.AverageGrade
    # (see rules.list[].kind: factRange). Naming the fact bare is refused — a
    # range compares a number, and this fact answers three.
    #
    # CreatedAt is not declared under fields[] and never will be: the framework
    # stamps it and resolves the name itself, exactly as read.managed relies on.
    # The three stamped columns (CreatedAt, UpdatedAt, DeletedAt) are addressable
    # in a fact's filters whenever storage.managed declares them, which is what
    # makes "since when" and "among the archived" askable at all. Filters only —
    # aggregating a timestamp has no carrier, and grouping BY one would be one
    # group per row unless it were truncated, which this language cannot say.
    - name: CampusStandingByStatus
      aggregates:
        - {kind: count, as: Enrolments}
        - {kind: avg, field: Grade, as: AverageGrade}
        - {kind: max, field: Grade, as: TopGrade}
      groupBy: [Status]
      filters:
        - CampusID
        - {field: CreatedAt, op: gte, as: since}
      description: >-
        How many enrolments this campus has had per status since a given
        instant, and how they scored — counted, averaged and topped by the
        database in a single pass.
      activeOnly: true

read:
  # relational: the read is served straight from the tables, which makes it its
  # own KIND of read model rather than a flag on the projected one. Nothing is
  # materialised, so there is no collection, no version, no rebuild and no
  # drift — and view.version, indexes, deleteOnArchive and ttlSeconds are
  # REFUSED here rather than silently discarded. See example sharedbase for the
  # mongo half.
  backing: relational
  view:
    name: students
    maxLimit: 200
  fieldRestrict:
    - field: Grade
      permission: student:read-grade
    - field: TaxNumber
      permission: student:read-tax-id
  # A COMPUTED read field: one the reads return and no column holds. The
  # language declares the shape — the name, the type, the stored fields the
  # derivation reads — and the BODY is yours, in
  # internal/application/queries/<entity>_computed_manual.go, which the
  # generator writes once and never touches again.
  #
  # What the declaration alone buys, on every surface at once:
  #   ?fields=enrollmentLabel  fetches `from:` instead of a name no column has
  #   ?orderBy=enrollmentLabel is a typed 400 — ordering happens in the store
  #   the CSV/XLSX export       keeps the column, headed by labelKey
  #
  # It is therefore neither filterable nor sortable, and declaring it under
  # byParams.filters is refused for the same reason.
  # The framework's OWN stamps on the read side. They are declared under
  # storage.managed and belong to no fields[] entry — the aggregate carries no Go
  # field for them — so the read side names them here, by the fixed logical names
  # the framework resolves: CreatedAt, UpdatedAt, DeletedAt. Listing one projects
  # it into the view, returns it from the by-id read and every listing row, keeps
  # it in the CSV/XLSX export, and makes it filterable like any other field.
  #
  # It is DECLARED rather than automatic because it changes the view's SHAPE. On
  # a MONGO backing that costs a read.view.version bump in the same edit, or the
  # framework refuses to boot against the older projection; on this relational
  # one there is no projection to be older than, so the change is free.
  managed: [CreatedAt, UpdatedAt]
  computed:
    - name: EnrollmentLabel
      type: string
      from: [Name, EnrollmentNumber]
      labelKey: StudentEnrollmentLabelField
      example: "Alice Parker Reid (2026-00417)"
      description: The student's name followed by the enrollment number, for listings.
  byId: true
  byParams:
    filters:
      - field: Name
        ops: [eq, contains, icontains]
      - field: EnrollmentNumber
        ops: [eq, in]
      - field: Status
        ops: [eq, in]
      # A hidden field filters like any other: the column is there, and the
      # caller who searches by it still receives no field back.
      - field: NationalID
        ops: [eq]
      - field: Grade
        ops: [eq, gte, lte]
      - field: EnrolledAt
        ops: [gte, lte]
      # A framework-stamped column filters like any other, once read.managed
      # exposes it: "created between these dates" needs no field of its own.
      - field: CreatedAt
        ops: [gte, lte]
      # A part filters like any other field, under the name `as:` exposed it by.
      - field: TuitionAmount
        ops: [eq, gte, lte]
      # The aggregate id, which is declared NOWHERE — not under fields[] (the
      # name is reserved: the framework's managed carrier owns it) and not under
      # read.managed (that key is for the three timestamps). It filters and
      # orders anyway: the column is on the root's row whatever this spec says,
      # the framework resolves the logical name ID against the TableSchema, and
      # the projector writes it as the document's _id.
      #
      # The operators are an opaque value's — eq/ne/in/nin. `in` is the useful
      # one: fetch a known set of rows in a single call.
      - field: ID
        ops: [eq, in]
    # The ordering VOCABULARY: which paths ?orderBy= accepts. It travels with
    # controls.orderBy below and neither half is legal alone — the control is the
    # SWITCH that decides whether the endpoint takes the parameter at all, this
    # decides which paths it admits, and the framework fails the boot on either
    # by itself. Nothing is orderable until it is named here: an unindexed sort
    # is a blocking sort whose cost grows with the matching set, so "every field
    # the response renders" was the wrong default.
    #
    # A path does NOT need a filter of its own. UpdatedAt below is filtered by
    # nobody and orderable by everybody, which emits a leaf that carries no value
    # on the wire and no query parameter of its own.
    #
    # ID is orderable on every entity, declared here or not: it is the one path
    # indexed before anybody asks for it, and it is already the tie-break the
    # keyset cursor appends to every key — so it is the cheapest total order a
    # listing can offer, and the one to reach for when the listing needs a
    # deterministic sequence rather than a meaningful one.
    sort: [ID, Name, EnrollmentNumber, EnrolledAt, UpdatedAt]
    controls:
      pagination: true
      orderBy: true
      fields: true
      onlyTotal: true
      includeArchived: true

# WHERE this entity answers. Three INDEPENDENT switches: any one of them alone
# is a complete answer. graphql does not need rest, and neither does exports —
# a service that publishes nothing but the spreadsheet declares exports and
# leaves rest false.
#
# Enabling a surface exposes everything the entity mounts on it: both reads,
# every write verb, and (for a per-child collection) every per-entry verb it
# mounts. The keys below only NARROW — `mutations` picks a subset of the write
# verbs, absent meaning all of them; `connection` turns the paged query off,
# absent meaning served. The singular query follows read.byId either way, so
# turning the listing off never costs you the read-one field.
#
# A collection narrows its own seat where it is declared, under
# children[].surfaces — see the sharedbase example (`explain example sharedbase`).
surfaces:
  rest: true
  graphql:
    enabled: true
    connection: true
    mutations: [insert, update, archive, unarchive]
  exports:
    csv:
      delimiter: ";"
    xlsx:
      sheet: Students

authz:
  resource: student
  dataAccess: anyone-with-permission
  permissions:
    insert: student:insert
    update: student:update
    patch: student:update
