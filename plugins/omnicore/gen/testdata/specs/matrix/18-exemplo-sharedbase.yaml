# A COMPLETE, VALID spec — the SHARED-IDENTITY posture.
#
# `omnicore-gen check` accepts this file as it stands, and a test in this build
# asserts that, so it cannot drift into an example that no longer works.
#
# It exists because the flat example cannot show everything: storage.kind is one
# value, so a single spec can never carry both postures. Together they cover the
# language. What lives HERE and nowhere else:
#
#   the whole storage.base block   — link, naturalKey, schemaFunc, linkColumn,
#                                    rowUniqueness, orphanPolicy, reuse
#   fields[].livesOn: base|role    — which table a field is stored in
#   children[].editStrategy: per-child + duplicateNotification + operations
#   children[].ownedBy: base       — a collection of the IDENTITY, not of the role
#   siblings[].attachTo: role      — a 1:1 facet of the role
#   rules: requiredIf · skipWhen · transition · comparison · groupCap ·
#          childDuplicate · ownerCheck with adminField
#   read.indexes · search · ttlSeconds · fieldRestrict
#
# It also shows something you do NOT declare: because it has a facet AND GraphQL,
# the generator adds a `clearQualificationOfTeacher` mutation. On GraphQL an
# omitted field and an explicit null reach the code identically, so "clear this"
# cannot be told from "leave this alone" — the intent needs its own verb, and the
# REST equivalent stays the root's PUT with the facet's fields null.
#
# The human-facing text here is English because `language:` says so. Write yours
# in whatever your project speaks, and declare it — the report quotes these
# descriptions back to a reviewer under that heading.
#
# A description and a LABEL are different things. The description is a sentence
# about what the field means and becomes the column comment; the label is the
# field's short human NAME — what a 422 payload puts in `fieldLabel` and what a
# CSV/XLSX export puts in a column header. The label is `text:`, optional and per
# catalog (the flat example shows one); a catalog left out falls back to the
# field's own name.
#
# Copy the STRUCTURE, never the domain.
specVersion: 1
entity: Teacher
plural: Teachers
language: en-US

storage:
  # A ROLE over an identity other roles may share: the same person can be a
  # teacher today and a supplier later, without duplicating the person.
  kind: sharedbase-role
  table: teachers
  description: Teachers — the teaching role over the person identity.
  base:
    table: persons
    # REQUIRED: the exported Go function that returns the identity's schema.
    schemaFunc: PersonBase
    # REQUIRED for separate-fk, REFUSED for shared-pk (there the role's own
    # primary key IS the identity's, so there is no second column to name).
    linkColumn: person_id
    description: The person identity, shared across roles.
    # false = this spec writes the base. true = another role already declares it,
    # and this one only points at it.
    reuse: false
    # The value the identity is deduplicated by; the framework derives the
    # identity's key from it, so two roles created with the same one resolve to
    # ONE person rather than to two.
    naturalKey: Document
    link: separate-fk
    # active-only: an archived role frees the slot, so the person can hold the
    # role again later while the old rows stay as history.
    rowUniqueness: active-only
    orphanPolicy: delete-when-unreferenced
  managed:
    revision: revision
    createdAt: created_at
    updatedAt: updated_at
    archivedAt: deleted_at

fields:
  # livesOn decides the TABLE: base fields are shared by every role over the
  # identity; role fields are private to this one.
  - name: Document
    type: string
    column: document
    length: 20
    livesOn: base
    example: "PA-4471902"
    description: The person's identification document — the identity's natural key.
  - name: Name
    type: string
    column: name
    length: 160
    livesOn: base
    example: Helen Duarte
    description: The person's full name.
  - name: Email
    type: string
    column: email
    length: 160
    livesOn: base
    vo: {kind: raw, ref: PersonEmail}
    example: helen@school.edu
    description: The person's e-mail address.
  - name: CampusID
    type: id
    column: campus_id
    livesOn: role
    example: 9f14b0a2-6d38-4c5e-b7a1-2e0c5d81f4a3
    description: The campus this contract belongs to.
  - name: RegistrationNumber
    type: string
    column: registration_number
    length: 20
    livesOn: role
    unique:
      enforce: service-precheck+constraint
      notification: RegistrationNumberAlreadyExistsNotification
      # active-only: an archived teacher frees the number for reuse.
      scope: active-only
      # within: WHAT the uniqueness is per. The number is unique inside ONE
      # campus, not across the institution — two campuses may both issue
      # DOC-2026-001. It sizes the index (campus_id, registration_number) AND is
      # held to the precheck fact's filters, in both directions: those two used
      # to be able to disagree, and a per-campus check behind a global index
      # means the domain accepts a number the database then refuses — reported
      # as "already taken" for a campus where it is free.
      within: [CampusID]
    example: DOC-2026-001
    description: The teacher's staff registration number, unique within its campus.
  - name: Status
    type: string
    column: status
    length: 20
    livesOn: role
    vo: {kind: enum, ref: TeacherStatus}
    example: active
    description: The status of the teaching contract.
  - name: WeeklyHours
    type: int
    column: weekly_hours
    livesOn: role
    example: "40"
    description: Contracted hours per week.
  - name: HiredAt
    type: time
    column: hired_at
    livesOn: role
    example: "2026-02-01T09:00:00Z"
    description: The hiring date.
  - name: TerminatedAt
    type: time
    column: terminated_at
    nullable: true
    livesOn: role
    example: "2026-12-20T18:00:00Z"
    description: The termination date, when there is one.
  # Runtime-only: read from a token claim, never persisted. `bool` is read from a
  # boolean claim or from the string "true".
  - name: RequesterEmail
    type: string
    runtime: true
    claim: email
    livesOn: root
    example: helen@school.edu
    description: The e-mail of whoever made the call.
  - name: RequesterIsAdmin
    type: bool
    runtime: true
    claim: is_admin
    livesOn: root
    example: "false"
    description: Whether the caller is an administrator.

valueObjects:
  - name: PersonEmail
    kind: raw
    backing: string
    description: A valid e-mail address.
    regex: '^[^@\s]+@[^@\s]+\.[a-z]{2,}$'
    minLength: 6
    maxLength: 160
    notification: InvalidPersonEmailNotification
  - name: TeacherStatus
    kind: enum
    backing: string
    description: The status of a teaching contract.
    unknownNotification: UnknownTeacherStatusNotification
    members:
      - {name: Active, value: active}
      - {name: Suspended, value: suspended}
      - {name: Terminated, value: terminated}

children:
  # ownedBy: base — the collection belongs to the IDENTITY. It survives this role
  # being archived and every other role over the same person reads the same rows.
  - name: Address
    plural: Addresses
    table: person_addresses
    parentColumn: person_id
    description: The person's addresses, shared across roles.
    ownedBy: base
    editStrategy: atomic-replace
    businessIdentity: [ZipCode, Number]
    fields:
      - {name: Street, type: string, column: street, length: 160, example: Maple Avenue, description: The street.}
      - {name: Number, type: string, column: street_number, length: 10, example: "128", description: The street number.}
      - {name: ZipCode, type: string, column: zip_code, length: 9, example: 90000-000, description: The postal code.}

  # editStrategy: per-child — POST/PUT on /:id/classes[/:classId], a duplicate
  # answer on add, and a 404 for an entry that is not there. softRemove makes the
  # removal reversible, so it is mounted as PATCH .../archive rather than DELETE.
  - name: Class
    plural: Classes
    table: teacher_classes
    parentColumn: teacher_id
    description: The classes the teacher runs.
    ownedBy: role
    editStrategy: per-child
    # operations — WHICH of the per-entry verbs to mount. Absent means all three,
    # which is exactly what this line spells out; it is written here so the key
    # is not something you have to guess exists. Leave `change` out where every
    # field IS the business identity: replacing such an entry cannot change it
    # and still leave it the same entry, so the verb turns one entry into
    # another while keeping the first one's row id — which an audit trail reads
    # as one thing becoming another rather than as a removal and an addition.
    operations: [add, change, remove]
    duplicateNotification: ClassAlreadyAssignedNotification
    businessIdentity: [Code]
    softRemove: true
    archivedAt: deleted_at
    fields:
      - {name: Code, type: string, column: code, length: 20, example: 3B-2026, description: The class code.}
      - {name: Subject, type: string, column: subject, length: 80, example: Mathematics, description: The subject taught.}
      - {name: Period, type: string, column: period, length: 10, example: morning, description: The period of day.}
    rules:
      list:
        - {id: class-code-required, kind: required, scope: [insertOrUpdate], fields: [Code], notification: RequiredFieldNotification}
        # A notification raised by a CHILD's rule is declared in aggregatevos:
        # domain imports aggregatevos, so holding it in domain is an import
        # cycle. The generator places it there and the report says so.
        - id: subject-has-length
          kind: length
          scope: [insertOrUpdate]
          fields: [Subject]
          min: 3
          notification: InvalidSubjectNotification

siblings:
  # attachTo: role — a 1:1 facet of the ROLE (a shared base cannot have one: it
  # has many roles, so the 1:1 does not hold). Its fields are fields of the same
  # Go type, split into another table so they can be null in bulk.
  - name: Qualification
    table: teacher_qualifications
    description: Academic qualification, when it is on record.
    attachTo: role
    fields:
      - {name: HighestDegree, type: string, column: highest_degree, length: 40, nullable: true, example: Doctorate, description: The highest degree held.}
      - {name: DegreeInstitution, type: string, column: degree_institution, length: 160, nullable: true, example: Riverside University, description: The awarding institution.}

modes: [display, insert, update, archive, unarchive]

update:
  shape: both
  # A field a partial update may NOT touch — a natural key, or anything whose
  # change has to go through a deliberate operation instead.
  patchExcludes: [Document]

delete:
  root: soft
  # There is a key that would fit here and is deliberately NOT declared:
  # `delete.archiveWhen`, which makes an ordinary update finish as an archive —
  # a contract moving to "terminated" retiring the row off the same PATCH.
  #
  # It is left out because of what guards removal on THIS entity. A write passes
  # two gates before the framework writes it:
  #
  #   1. the PERMISSION on the route it arrived at — `teacher:archive` on
  #      PATCH /teachers/:id/archive, `teacher:update` on PATCH /teachers/:id;
  #   2. the RULES that fire for the verb the write turned out to be — the
  #      `only-the-owner-archives` ownerCheck below runs in ModeArchive.
  #
  # archiveWhen changes what the write IS, not which door it came through: it
  # runs under `teacher:update`, and IfArchive does not fire on that path (the
  # rules run once, in ModeUpdate). Both gates this entity declares for removal
  # would be skipped — a caller holding only `teacher:update`, over a row that is
  # not theirs, would retire it.
  #
  # So the key is not for every entity: declare it when removal is guarded the
  # same way the update is, and restate the guard with scope: [update] when it is
  # not. Matrix case 06 is the shape that qualifies — no archive-scoped rule at
  # all — and the flat example (`explain example`) shows the declaration itself.

rules:
  list:
    - {id: name-required, kind: required, scope: [insertOrUpdate], fields: [Name], notification: RequiredFieldNotification}
    # immutable reads the pre-write snapshot, so it only applies on update.
    - id: document-immutable
      kind: immutable
      scope: [update]
      fields: [Document]
      notification: DocumentCannotChangeNotification
      # echoValue defaults to TRUE: a refusal carries the value that was refused,
      # because "that is not allowed" and "1234 is not allowed" are different
      # messages and only the second one can be acted on. It is turned off HERE
      # because a national id has no business travelling back in a 422 — nothing
      # in the language marks a field as sensitive, so this is the author's call.
      echoValue: false
    - id: weekly-hours-valid
      kind: range
      scope: [insertOrUpdate]
      fields: [WeeklyHours]
      min: 1
      max: 44
      notification: WeeklyHoursOutOfRangeNotification
    # comparison relates two fields; skipWhen stands down when the subject is
    # absent — "valid IF given" rather than "required".
    - id: termination-after-hiring
      kind: comparison
      scope: [insertOrUpdate]
      fields: [TerminatedAt]
      other: HiredAt
      operator: gte
      skipWhen: "null"
      notification: TerminationBeforeHiringNotification
    # requiredIf: this field becomes required when THAT one carries a value.
    - id: terminated-requires-status
      kind: requiredIf
      scope: [insertOrUpdate]
      fields: [Status]
      other: TerminatedAt
      notification: RequiredFieldNotification
    # transition: the state machine. Update only — an insert has nothing to move
    # from — and a value that did not change is always allowed.
    - id: status-transition
      kind: transition
      scope: [update]
      fields: [Status]
      transitions:
        active: [suspended, terminated]
        suspended: [active, terminated]
      notification: InvalidStatusTransitionNotification
    # childDuplicate and groupCap read the whole COLLECTION, so they name it
    # instead of naming fields.
    - id: no-repeated-class
      kind: childDuplicate
      scope: [insertOrUpdate]
      fields: [Class]
      notification: ClassAlreadyAssignedNotification
    - id: at-most-two-per-period
      kind: groupCap
      scope: [insertOrUpdate]
      fields: [Class]
      groupBy: [Period]
      cap: 2
      notification: TooManyClassesNotification
    # `only` counts ONLY the entries that match. Without it the cap lands on
    # every value of the grouped field equally — "at most 3 under review" would
    # also become "at most 3 rejected", a rule nobody declared. With `only` and
    # no `groupBy`, the cap is over the whole collection restricted to the value.
    - id: at-most-one-morning-class
      kind: groupCap
      scope: [insertOrUpdate]
      fields: [Class]
      cap: 1
      only: {field: Period, equals: morning}
      notification: TooManyClassesNotification
    # ownerCheck is Layer 2: the permission says who may attempt the verb at all,
    # this says who may attempt it on a row that is not theirs. adminField is the
    # bypass, and it is a separate question from the permission.
    - id: only-the-owner-archives
      kind: ownerCheck
      scope: [archive]
      fields: [Email]
      ownerField: RequesterEmail
      adminField: RequesterIsAdmin
      notification: ArchiveNotAllowedNotification
  # Anything the DSL cannot express goes here as a NAMED item: it becomes a line
  # in the report and a stub in a file regeneration never touches.
  manual:
    - id: summed-hours-of-classes
      description: >-
        The hours of the teacher's active classes, summed, may not exceed the
        contracted weekly hours.
      scope: [insertOrUpdate]
      notification: WeeklyHoursOutOfRangeNotification

notifications:
  - name: RegistrationNumberAlreadyExistsNotification
    semantic: conflict
    description: The registration number is already held by another active teacher.
    text: {ptbr: "Já existe um professor com essa matrícula.", eng: "A teacher with this registration number already exists.", esp: "Ya existe un profesor con esa matrícula.", fra: "Un enseignant avec ce matricule existe déjà.", deu: "Es gibt bereits eine Lehrkraft mit dieser Nummer.", ita: "Esiste già un docente con questa matricola.", nld: "Er bestaat al een docent met dit nummer."}
  - name: DocumentCannotChangeNotification
    semantic: validation
    description: An attempt to change the identity's natural key.
    text: {ptbr: "O documento não pode ser alterado.", eng: "The document cannot be changed.", esp: "El documento no puede cambiarse.", fra: "Le document ne peut pas être modifié.", deu: "Das Dokument kann nicht geändert werden.", ita: "Il documento non può essere modificato.", nld: "Het document kan niet worden gewijzigd."}
  - name: WeeklyHoursOutOfRangeNotification
    semantic: validation
    description: Weekly hours outside the contractual range.
    tvars: [min, max]
    text: {ptbr: "A carga horária deve estar entre {min} e {max}.", eng: "The workload must be between {min} and {max}.", esp: "La carga debe estar entre {min} y {max}.", fra: "La charge doit être entre {min} et {max}.", deu: "Die Stundenzahl muss zwischen {min} und {max} liegen.", ita: "Il carico deve essere tra {min} e {max}.", nld: "De belasting moet tussen {min} en {max} liggen."}
  - name: TerminationBeforeHiringNotification
    semantic: validation
    description: A termination dated before the hiring.
    text: {ptbr: "O desligamento não pode ser anterior à admissão.", eng: "The termination cannot precede the admission.", esp: "La baja no puede ser anterior al alta.", fra: "Le départ ne peut pas précéder l'arrivée.", deu: "Der Austritt kann nicht vor dem Eintritt liegen.", ita: "La cessazione non può precedere l'assunzione.", nld: "Het vertrek kan niet vóór de indiensttreding liggen."}
  - name: InvalidStatusTransitionNotification
    semantic: state-conflict
    description: A status change that is not allowed.
    text: {ptbr: "O professor não pode ir para essa situação.", eng: "The teacher cannot move to that state.", esp: "El profesor no puede pasar a ese estado.", fra: "L'enseignant ne peut pas passer à cet état.", deu: "Die Lehrkraft kann nicht in diesen Zustand wechseln.", ita: "Il docente non può passare a questo stato.", nld: "De docent kan niet naar die staat."}
  - name: ClassAlreadyAssignedNotification
    semantic: conflict
    description: The class is already assigned to this teacher.
    text: {ptbr: "Essa turma já está atribuída ao professor.", eng: "That class is already assigned to the teacher.", esp: "Esa clase ya está asignada.", fra: "Cette classe est déjà attribuée.", deu: "Diese Klasse ist bereits zugewiesen.", ita: "Quella classe è già assegnata.", nld: "Die klas is al toegewezen."}
  - name: TooManyClassesNotification
    semantic: validation
    description: Too many classes in the same period.
    text: {ptbr: "Há turmas demais no mesmo período.", eng: "Too many classes in the same period.", esp: "Demasiadas clases en el mismo periodo.", fra: "Trop de classes sur la même période.", deu: "Zu viele Klassen im selben Zeitraum.", ita: "Troppe classi nello stesso periodo.", nld: "Te veel klassen in dezelfde periode."}
  # package: aggregatevos — raised by a child's rule, so the type must live
  # beside the child. Declaring it in domain would be an import cycle.
  - name: InvalidSubjectNotification
    package: aggregatevos
    semantic: validation
    description: A subject name that is too short.
    text: {ptbr: "O nome da disciplina é curto demais.", eng: "The subject name is too short.", esp: "El nombre de la asignatura es demasiado corto.", fra: "Le nom de la matière est trop court.", deu: "Der Fachname ist zu kurz.", ita: "Il nome della materia è troppo corto.", nld: "De vaknaam is te kort."}
  # package: vos — raised by a value object.
  - name: InvalidPersonEmailNotification
    package: vos
    semantic: validation
    description: An e-mail outside the accepted format.
    text: {ptbr: "O e-mail informado não é válido.", eng: "The e-mail is not valid.", esp: "El correo no es válido.", fra: "L'e-mail n'est pas valide.", deu: "Die E-Mail ist ungültig.", ita: "L'e-mail non è valida.", nld: "Het e-mailadres is ongeldig."}
  - name: UnknownTeacherStatusNotification
    package: vos
    semantic: validation
    description: A status outside the closed set.
    text: {ptbr: "Situação inválida.", eng: "Invalid state.", esp: "Estado inválido.", fra: "État invalide.", deu: "Ungültiger Zustand.", ita: "Stato non valido.", nld: "Ongeldige staat."}

service:
  required: true
  facts:
    # The precheck half of RegistrationNumber's unique
    # (service-precheck+constraint, above) asks THIS fact: an exists filtered by
    # the unique field, with excludeSelf so an update does not collide with
    # itself. Declaring the enforcement without a fact like this one is refused —
    # the precheck would otherwise silently not be generated.
    - name: RegistrationNumberTaken
      kind: exists
      description: >-
        Whether an active teacher on the SAME campus already holds this
        registration number.
      field: RegistrationNumber
      # Exactly the index's columns: unique.within first, then the field itself.
      # Any other list is refused — a filter the index does not cover, or an
      # index column the filter drops, is the two halves answering different
      # questions and reporting one of them under the other's notification.
      filters: [CampusID, RegistrationNumber]
      excludeSelf: true
      activeOnly: true
    - name: ActiveClassesOfRegistration
      kind: count
      description: How many active classes this registration already has.
      # The fact narrows by a field, may exclude the record being written
      # (so an update does not collide with itself) and may count only the
      # rows that are not archived.
      field: RegistrationNumber
      filters: [Status]
      excludeSelf: true
      activeOnly: true
    # The aggregating kinds — sum, avg, min, max — compute in the DATABASE over
    # the rows the filters select. Two things about them are decided for you and
    # are worth knowing before you read the generated port:
    #
    #   * the RETURN TYPE follows the kind, not the column. An average is
    #     fractional even over an integer field (float64); a sum, a minimum or a
    #     maximum over int or int64 is exact (int64). Only a numeric field can be
    #     aggregated — max over a name or a date is refused, because the
    #     framework carries an aggregate as an exact integer or a float and has
    #     no carrier for text or for a timestamp.
    #   * min, max and avg answer `(value, bool)`. Over an empty set SQL says
    #     NULL, and a zero returned on its own reads as a real result — so the
    #     rule that consults the fact is made to decide what "there was nothing
    #     to average" means. sum and count return the value alone: there, zero
    #     IS the answer.
    - name: AverageWeeklyHours
      kind: avg
      description: The average weekly hours across active teachers.
      field: WeeklyHours
      activeOnly: true
    - name: HighestWeeklyHours
      kind: max
      description: The highest weekly hours in force.
      field: WeeklyHours
      activeOnly: true
    # `groupBy` makes the same aggregate PER GROUP — one SELECT with GROUP BY,
    # answered as one entry per distinct key, and the generated port returns a
    # slice of a struct carrying the key plus the value. Reach for it whenever
    # the question is "…per category": the alternative is loading the rows and
    # bucketing them in Go, which reads a whole table to compute what the
    # database computes in one pass.
    #
    # It is NOT the same tool as rules.list[].groupCap, and the difference is
    # not style. A fact counts rows that are IN THE TABLE. A groupCap counts the
    # entries THIS WRITE carries, which no query can see yet. Ask which set the
    # invariant is about and the choice makes itself.
    - name: TeachersByStatus
      kind: count
      groupBy: [Status]
      description: How many teachers sit in each contract status.
      activeOnly: true

read:
  backing: mongo
  view:
    name: teachers
    version: 1
    maxLimit: 100
    # A projection rebuilt from scratch drops archived documents when this is on.
    deleteOnArchive: false
    # A time-to-live on the projected document, in SECONDS.
    ttlSeconds: 0
  indexes:
    - {fields: [RegistrationNumber], unique: true}
    - {fields: [Name], text: true}
    # sparse indexes only the documents that HAVE the field.
    - {fields: [Status, HiredAt], order: desc, sparse: true}
  # A field a caller without the permission does not receive — and naming it
  # explicitly is a 403 rather than a silent omission.
  fieldRestrict:
    - {field: Email, permission: "teacher:read-contact"}
  byId: true
  byParams:
    filters:
      - {field: Name, ops: [eq, contains, icontains]}
      - {field: RegistrationNumber, ops: [eq]}
      - {field: Status, ops: [eq, in]}
    # The ordering vocabulary, which travels with controls.orderBy below: the
    # control is the SWITCH, this is WHICH paths ?orderBy= admits. Neither half
    # is legal alone — the framework fails the boot on a switch with nothing to
    # switch on, and on tags that reach no wire.
    sort: [Name, RegistrationNumber]
    controls:
      pagination: true
      orderBy: true
      fields: true
      includeArchived: true
      onlyTotal: true
      search: [Name]

surfaces:
  rest: true
  graphql: {enabled: true, connection: true, mutations: [insert, update, archive, unarchive]}
  exports: {csv: {delimiter: ";"}, xlsx: {sheet: Teachers}}

authz:
  resource: teacher
  dataAccess: anyone-with-permission
  permissions:
    insert: "teacher:insert"
    update: "teacher:update"
    patch: "teacher:update"
    archive: "teacher:archive"
    unarchive: "teacher:archive"
    read: "teacher:read"
