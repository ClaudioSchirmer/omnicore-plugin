# Eixo: ownerCheck com bypass de administrador lido de um claim BOOLEANO cru.
#
# É o eixo de cobertura de `source: claim` sobre um bool, e não o formato
# recomendado: `claim: is_admin` lê um booleano que o token por acaso carrega —
# não resolve `sala:*`, não honra `*:*` e ignora authorization.permissionsClaim.
# Para perguntar ao MODELO de autorização, que é o que fecha as rotas, o
# formato é `source: permission` com a permissão (veja 36-fontes-de-identidade).
specVersion: 1
entity: Sala
plural: Salas
language: pt-BR
storage:
  kind: flat
  table: salas
  description: Salas de aula.
  managed: {revision: revision, archivedAt: deleted_at}
fields:
  - {name: Codigo, type: string, column: codigo, length: 10, livesOn: root, example: "A-101", description: Código da sala.}
  - name: SolicitanteEmail
    type: string
    column: ""
    length: 200
    runtime: true
    claim: email
    livesOn: root
    example: ana@x.com
    description: E-mail de quem chamou.
  - name: SolicitanteAdmin
    type: bool
    column: ""
    runtime: true
    claim: is_admin
    livesOn: root
    example: "false"
    description: Se quem chamou e administrador.

modes: [display, insert, archive, unarchive]
rules:
  list:
    - id: so-o-dono-arquiva
      kind: ownerCheck
      scope: [archive]
      fields: [Codigo]
      ownerField: SolicitanteEmail
      adminField: SolicitanteAdmin
      notification: ArchiveNotAllowedNotification

read:
  backing: relational
  view: {name: salas}
  byId: true
surfaces: {rest: true}
authz:
  resource: sala
  dataAccess: anyone-with-permission
  permissions: {insert: "sala:escrever", read: "sala:ler", archive: "sala:arquivar", unarchive: "sala:arquivar"}
