# Eixo: VALUE OBJECT COMPOSTO ESCRITO À MÃO (written: manual).
#
# A forma continua declarada aqui — é ela que o schema decompõe em colunas, que
# os mappers dobram e desdobram, que a migration dimensiona e que os catálogos
# traduzem. O que muda de dono é o ARQUIVO: o gerador não escreve
# internal/domain/vos/chave_permissao.go, e a árvore só compila depois que
# alguém escreve o tipo. Essa metade vem de 27-composite-vo-manual.hand/.
#
# É o caso que o gerador não alcança de outro jeito: a regra "se o recurso é *,
# a ação também precisa ser *" olha uma parte em função da OUTRA, e não é regex,
# nem faixa, nem comparação. Junto com ela vem o String() que rende o conceito —
# um composto pode expor qualquer nome menos Value(), cuja AUSÊNCIA é o que diz
# ao framework para decompor em vez de guardar a renderização numa coluna.
specVersion: 1
entity: Permissao
plural: Permissoes
language: pt-BR
storage:
  kind: flat
  table: permissoes
  description: Permissões concedidas, na forma recurso:acao.
  managed: {revision: revision, createdAt: created_at, updatedAt: updated_at, archivedAt: deleted_at}
fields:
  - {name: Descricao, type: string, column: descricao, length: 120, livesOn: root, example: "Leitura de alunos", description: O que a permissão concede.}
  # O composto à mão ocupa DUAS colunas, exatamente como um gerado: quem lê,
  # filtra ou ordena vê chaveRecurso e chaveAcao e nunca sabe que existe um
  # value object.
  - name: Chave
    livesOn: root
    vo: {kind: composite, ref: ChavePermissao}
    description: A permissão em si.
    # UNIQUE sobre o composto = unique sobre a TUPLA. É a única leitura que um
    # value object admite: "nenhuma metade quer dizer nada sozinha" foi o que fez
    # dele um campo só, então uma constraint sobre uma parte recusaria linhas que
    # o domínio aceita. active-only: arquivar uma permissão libera o par.
    unique:
      enforce: service-precheck+constraint
      notification: ChaveJaExisteNotification
      scope: active-only
    parts:
      - {part: Recurso, column: chave_recurso, as: ChaveRecurso, length: 60, example: aluno}
      - {part: Acao,    column: chave_acao,    as: ChaveAcao,    length: 30, example: ler}
valueObjects:
  - name: ChavePermissao
    kind: composite
    written: manual
    description: >-
      Um par recurso:acao. O curinga é o motivo de a regra ser escrita à mão —
      um recurso "*" só faz sentido com uma ação "*", e nenhuma chave desta
      linguagem diz "se a parte A vale X, a parte B precisa valer Y".
    parts:
      - name: Recurso
        type: string
        description: O recurso que a permissão alcança, ou * para todos.
        labelKey: ChavePermissaoRecursoField
      - name: Acao
        type: string
        description: A ação permitida sobre o recurso, ou * para todas.
        labelKey: ChavePermissaoAcaoField
rules:
  list:
    # IMMUTABLE sobre o composto INTEIRO. É a única invariante da entidade que um
    # value object responde, porque é a única que pergunta pelo VALOR e não por
    # uma parte: Go compara struct de campos comparáveis por valor, então o == da
    # regra contra o snapshot pré-escrita quer dizer o que o domínio quer dizer.
    - {id: chave-imutavel, kind: immutable, scope: [update], fields: [Chave], notification: SchemaViolationNotification}
service:
  required: true
  facts:
    # A metade pré-check da unicidade. Um fato sobre PARTES: o par inteiro, que é
    # a pergunta que a constraint responde no banco meio segundo depois.
    - name: ChaveTomada
      kind: exists
      filters: [ChaveRecurso, ChaveAcao]
      excludeSelf: true
      activeOnly: true
      description: Se outra permissão ativa já ocupa este par recurso:ação.
notifications:
  - name: ChaveJaExisteNotification
    package: domain
    semantic: conflict
    description: Par recurso:acao ja concedido.
    text: {ptbr: "Esta permissao ja existe.", eng: "This permission already exists.", esp: "Este permiso ya existe.", fra: "Cette permission existe deja.", deu: "Diese Berechtigung existiert bereits.", ita: "Questo permesso esiste gia.", nld: "Deze permissie bestaat al."}
modes: [display, insert, update, archive]
update: {shape: patch}
read:
  backing: relational
  view: {name: permissoes}
  # Colunas carimbadas pelo framework, expostas na leitura porque foram
  # DECLARADAS. Entram na view, no by-id, em cada linha da listagem e no export,
  # e podem ser filtradas como qualquer campo — "criadas entre estas datas" é a
  # pergunta que toda listagem acaba recebendo.
  managed: [CreatedAt, UpdatedAt]
  # Um campo computado com UMA derivação: a mesma função serve o by-id, a
  # listagem esparsa e as respostas de escrita. Quem cria a permissão recebe de
  # volta a string que acabou de criar, sem um segundo GET.
  computed:
    - name: ChaveRenderizada
      type: string
      from: [ChaveRecurso, ChaveAcao]
      example: "aluno:ler"
      description: A permissão renderizada como recurso:ação.
  byId: true
  byParams:
    filters:
      - {field: ChaveRecurso, ops: [eq]}
      - {field: ChaveAcao, ops: [eq]}
      - {field: CreatedAt, ops: [gte, lte]}
surfaces: {rest: true}
authz:
  resource: permissao
  dataAccess: anyone-with-permission
  permissions:
    insert: "permissao:escrever"
    patch: "permissao:escrever"
    archive: "permissao:escrever"
    read: "permissao:ler"
