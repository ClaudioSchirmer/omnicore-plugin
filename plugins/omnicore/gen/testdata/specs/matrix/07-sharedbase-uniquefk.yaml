# Eixos: SharedBase separate-FK com unicidade unique-fk (0..1 linha, para sempre)
# e política de órfão "apagar quando ninguém referencia".
specVersion: 1
entity: Bibliotecario
plural: Bibliotecarios
language: pt-BR
storage:
  kind: sharedbase-role
  table: bibliotecarios
  description: Bibliotecários — outro papel sobre a mesma identidade de pessoa.
  base:
    table: pessoas_bib
    schemaFunc: PessoaBibBase
    linkColumn: pessoa_bib_id
    description: Identidade de pessoa.
    naturalKey: Documento
    link: separate-fk
    rowUniqueness: unique-fk
    orphanPolicy: delete-when-unreferenced
  managed: {revision: revision, createdAt: created_at, updatedAt: updated_at, archivedAt: deleted_at}
fields:
  - {name: Documento, type: string, column: documento, length: 20, livesOn: base, example: "123.456.789-00", description: Documento — chave natural.}
  - {name: Nome, type: string, column: nome, length: 160, livesOn: base, example: Carlos Lima, description: Nome da pessoa.}
  - {name: Setor, type: string, column: setor, length: 40, livesOn: role, example: Acervo, description: Setor de atuação.}
modes: [display, insert, archive, unarchive]
delete: {root: soft}
rules:
  list:
    - {id: doc-obrigatorio, kind: required, scope: [insert], fields: [Documento], notification: RequiredFieldNotification}
read:
  backing: relational
  view: {name: bibliotecarios}
  byId: true
surfaces: {rest: true}
authz:
  resource: bibliotecario
  dataAccess: anyone-with-permission
  permissions: {insert: "bib:escrever", archive: "bib:arquivar", unarchive: "bib:arquivar", read: "bib:ler"}
