# Eixos: SharedBase com link shared-PK (o papel usa a MESMA chave da identidade),
# reuso de VO já existente no projeto, política de órfão "manter", e
# delete.archiveWhen — um update que termina como archive — sobre um PAPEL.
specVersion: 1
entity: Professor
plural: Professores
language: pt-BR
storage:
  kind: sharedbase-role
  table: professores
  description: Professores — papel docente sobre a identidade de pessoa.
  base:
    table: pessoas
    schemaFunc: PessoaBase
    description: Identidade de pessoa, compartilhada entre papéis.
    naturalKey: Documento
    link: shared-pk
    orphanPolicy: keep
  managed: {revision: revision, createdAt: created_at, updatedAt: updated_at, archivedAt: deleted_at}
fields:
  - {name: Documento, type: string, column: documento, length: 20, livesOn: base, example: "123.456.789-00", description: Documento — chave natural da identidade.}
  - {name: NomeCompleto, type: string, column: nome_completo, length: 160, livesOn: base, example: Helena Duarte, description: Nome completo da pessoa.}
  - {name: Titulacao, type: string, column: titulacao, length: 40, livesOn: role, example: Doutorado, description: Titulação acadêmica.}
  # Situação do VÍNCULO, não da pessoa: por isso vive no papel. É ela que decide
  # quando o vínculo deixa de estar ativo — ver delete.archiveWhen abaixo.
  - name: Situacao
    type: string
    column: situacao
    length: 20
    livesOn: role
    vo: {kind: enum, ref: SituacaoDocente}
    example: ativo
    description: Situação do vínculo docente.
valueObjects:
  - name: SituacaoDocente
    kind: enum
    backing: string
    description: As situações possíveis de um vínculo docente.
    unknownNotification: SituacaoDocenteDesconhecidaNotification
    members:
      - {name: Ativo, value: ativo}
      - {name: Afastado, value: afastado}
      - {name: Desligado, value: desligado}
modes: [display, insert, update, archive, unarchive]
update: {shape: patch}
delete:
  root: soft
  # Um update que deixa o vínculo "desligado" É uma remoção: o DOMÍNIO decide, e
  # o framework roda o archive inteiro a partir do mesmo request.
  #
  # Este papel PODE declarar a chave porque nenhuma regra sua tem scope:
  # [archive] — não há proteção nenhuma sendo pulada, só a permissão troca
  # (professor:escrever no lugar de professor:arquivar). Compare com 18, que tem
  # um ownerCheck com scope archive e por isso não declara a chave.
  archiveWhen:
    field: Situacao
    equals: desligado
    description: Um vínculo desligado não é um registro ativo.
rules:
  list:
    - {id: doc-obrigatorio, kind: required, scope: [insertOrUpdate], fields: [Documento], notification: RequiredFieldNotification}
    - id: doc-imutavel
      kind: immutable
      scope: [update]
      fields: [Documento]
      notification: DocumentoImutavelNotification
      echoValue: true
notifications:
  - name: SituacaoDocenteDesconhecidaNotification
    semantic: validation
    text: {ptbr: Situação de vínculo fora do conjunto conhecido., eng: Contract situation outside the known set., esp: Situación de vínculo fuera del conjunto conocido., fra: Situation de contrat hors de l'ensemble connu., deu: Vertragsstatus außerhalb der bekannten Menge., ita: Situazione di contratto fuori dall'insieme noto., nld: Contractsituatie buiten de bekende verzameling.}
  - name: DocumentoImutavelNotification
    semantic: validation
    text: {ptbr: O documento não pode ser alterado., eng: The document cannot be changed., esp: El documento no se puede modificar., fra: Le document ne peut pas être modifié., deu: Das Dokument kann nicht geändert werden., ita: Il documento non può essere modificato., nld: Het document kan niet worden gewijzigd.}
read:
  backing: relational
  view: {name: professores}
  byId: true
  byParams:
    # ID sob sharedbase: a identidade e a chave COMPARTILHADA, na tabela base, e
    # o papel a le pela mesma coluna. Filtrar e ordenar por ela nao depende de
    # qual metade da identidade guarda o campo.
    filters: [{field: NomeCompleto, ops: [eq, contains]}, {field: ID, ops: [eq, in]}]
    sort: [ID, NomeCompleto]
    controls: {pagination: true, orderBy: true, includeArchived: true}
surfaces: {rest: true}
authz:
  resource: professor
  dataAccess: anyone-with-permission
  permissions: {insert: "professor:escrever", patch: "professor:escrever", archive: "professor:arquivar", unarchive: "professor:arquivar", read: "professor:ler"}
